version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: network-monitor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: network_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: network-monitor-backend:latest
    container_name: network-monitor-backend
    build:
      context: ./network-monitor-backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/network_monitor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      APP_DEMO_AUTO_INIT: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/dashboard/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    image: network-monitor-frontend:latest
    container_name: network-monitor-frontend
    build:
      context: ./network-monitor-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:

networks:
  default:
    name: network-monitor-network
    driver: bridge
